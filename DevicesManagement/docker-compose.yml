
services:
  smartfence_devicemanagement1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfence_devicemanagement1
    expose:
      - ${PROD_PORT} 
    env_file:
      - .env
    environment:
      - GO_ENV=development
      - SERVICE_ID=smartfence_devicemanagement1
      - MODE=production
      - PROD_PORT=${PROD_PORT}
      - DEV_PORT=${DEV_PORT}
    networks:
      - smartfence_devicemanagement_network
      - databaseservice_smartfence_database_network

  smartfence_devicemanagement2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfence_devicemanagement2
    env_file:
      - .env
    expose:
      - ${PROD_PORT}
    environment:
      - GO_ENV=development
      - SERVICE_ID=smartfence_devicemanagement2
      - MODE=production
      - PROD_PORT=${PROD_PORT}
      - DEV_PORT=${DEV_PORT}
    networks:
      - smartfence_devicemanagement_network
      - databaseservice_smartfence_database_network

  smartfence_nginx_devicemanagement:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: smartfence_nginx_devicemanagement
    platform: linux/amd64
    ports:
      - "${WEBSERVER_PORT}:80"
    env_file:
      - .env
    depends_on:
      - smartfence_devicemanagement1
      - smartfence_devicemanagement2
    networks:
      - smartfence_devicemanagement_network
      - databaseservice_smartfence_database_network
      
networks:
  smartfence_devicemanagement_network:
    driver: bridge

  databaseservice_smartfence_database_network:
    external: true
volumes:
  dbdata:
    driver: local
  local_pgdata:
  pgadmin-data:
